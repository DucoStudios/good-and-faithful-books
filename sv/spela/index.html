<style>
:root{--gold:#E9B44C;--gold-soft:#F6DFA8;--orange:#D9662B;--blue:#2F5D7C;--cream:#FFF8EC;--paper:#FFFDF8;--ink:#3B2A1E;--muted:#6E5B4C;--line:#EADCC4;--green:#4E8A4A;--red:#B5452F}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;margin:0}
body{background:linear-gradient(#BFE3F2 0%,#E6F4F9 55%,#F2E3BF 55%,#EBD49E 100%);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.page{height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(255,253,248,.85);border-bottom:1px solid var(--line);flex-shrink:0}
.top a{color:var(--ink);text-decoration:none;font-weight:800;font-size:.9rem}
.stats{display:flex;gap:14px;font-weight:900;font-size:.95rem}
.stats span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:18px 14px 28px}
.card{background:var(--paper);border-radius:22px;box-shadow:0 12px 30px rgba(59,42,30,.15);padding:22px;width:100%;max-width:560px}
h1,h2{font-family:"Fraunces",Georgia,serif;margin:0 0 10px;line-height:1.15}
h1{font-size:1.9rem}
h2{font-size:1.45rem}
p{margin:0 0 12px;line-height:1.55}
.muted{color:var(--muted)}
.intro{display:flex;gap:16px;align-items:flex-end}
.intro img{width:110px;flex-shrink:0}
.btn{display:block;width:100%;background:var(--orange);color:#fff;border:0;border-radius:999px;padding:14px 18px;font:900 1.05rem "Nunito",sans-serif;cursor:pointer;box-shadow:0 5px 0 #A9471A;margin-top:14px;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #A9471A}
.btn.alt{background:var(--blue);box-shadow:0 5px 0 #1D3D54}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.45}
.weather{display:flex;align-items:center;gap:14px;background:var(--cream);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.weather .ic{font-size:2.4rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .lbl b{display:block}
.row .lbl small{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;font:900 1.2rem "Nunito";color:var(--ink);cursor:pointer;touch-action:manipulation}
.stepper output{min-width:56px;text-align:center;font-weight:900;font-size:1.1rem}
.section-title{font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;color:var(--orange);margin:16px 0 4px}
.taste{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.taste i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold),var(--green));transition:width .3s}
.note{background:#FFF3D6;border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;font-family:"Fraunces",serif;font-style:italic;margin:14px 0}
.event{background:var(--cream);border-radius:16px;padding:16px;margin:12px 0}
.event .who{font-size:2rem}
.choices{display:grid;gap:8px;margin-top:8px}
.street{position:relative;height:120px;background:linear-gradient(#E9F5FA,#F7EBCF);border-radius:16px;overflow:hidden;margin:10px 0 14px}
.stand{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:3rem}
.walker{position:absolute;bottom:10px;font-size:1.8rem;animation:walk linear forwards}
@keyframes walk{from{left:-40px}to{left:calc(100% + 40px)}}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.result-grid div{background:var(--cream);border-radius:14px;padding:10px 12px}
.result-grid b{display:block;font-size:1.3rem}
.result-grid small{color:var(--muted);font-weight:700}
.stars{font-size:1.3rem;letter-spacing:3px}
.hide{display:none}
.days{display:flex;gap:6px;margin:4px 0 14px}
.days i{flex:1;height:8px;border-radius:999px;background:var(--line)}
.days i.done{background:var(--gold)}
.days i.now{background:var(--orange)}

  <main><div class="card" id="screen"><noscript><h1>Pennys saftstånd</h1><p>Pennys saftstånd är ett gratis spel i webbläsaren för barn från 7 år. Välj recept, sätt ett pris, håll koll på vädret och bestäm om du ska hjälpa en granne som behöver det. Spelet kräver JavaScript.</p></noscript></div></main>

<script>
// Pennys saftstånd. Ingen datainsamling, ingen lagring, inga externa anrop.
(function(){
var DAYS = 7, GOAL = 60;
var WEATHER = [
  {id:"hot",   ic:'<i class="fa-solid fa-sun" style="color:#D9662B" aria-hidden="true"></i><i class="fa-solid fa-temperature-high" style="color:#B5392E" aria-hidden="true"></i>', name:"Varmt och soligt", base:30, ideal:1.00, w:2},
  {id:"sunny", ic:'<i class="fa-solid fa-sun" style="color:#E9B44C" aria-hidden="true"></i>',   name:"Soligt",         base:22, ideal:0.75, w:3},
  {id:"cloudy",ic:'<i class="fa-solid fa-cloud-sun" style="color:#2F5D7C" aria-hidden="true"></i>',   name:"Mulet",        base:13, ideal:0.60, w:2},
  {id:"rain",  ic:'<i class="fa-solid fa-cloud-rain" style="color:#2F5D7C" aria-hidden="true"></i>',   name:"Regn",         base:6,  ideal:0.50, w:1}
];
var PRICES = {lemons:{qty:12,cost:2.00,label:"Påse med 12 citroner"}, sugar:{qty:12,cost:1.50,label:"Påse socker (12 skopor)"}, cups:{qty:25,cost:1.00,label:"Förpackning med 25 muggar"}};
var CUPS_PER_PITCHER = 10;

var S;
function reset(){
  S = {day:1, money:5.00, lemons:0, sugar:0, cups:0, price:0.75, lemonsPer:2, sugarPer:6,
       rep:1.0, sign:false, tommy:false, served:0, earned:0, spent:0, helped:0, forecast:null,
       nextDayBonus:0, log:[], eventUsed:{}};
}
var $ = function(id){ return document.getElementById(id); };
var screen = $("screen");
function money(n){ var v=Math.round(n*1000)/100; if (v>=100) v=Math.round(v); return (Number.isInteger(v)?v:v.toFixed(2).replace(".",","))+" kr"; }
function rnd(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function pickWeather(){
  var bag=[]; WEATHER.forEach(function(w){ for(var i=0;i<w.w;i++) bag.push(w); });
  return bag[Math.floor(Math.random()*bag.length)];
}
function topbar(){ $("sMoney").textContent = money(S.money); $("sDay").textContent = "Dag " + Math.min(S.day,DAYS) + "/" + DAYS; }
function daysBar(){ var h='<div class="days">'; for(var i=1;i<=DAYS;i++) h+='<i class="'+(i<S.day?'done':i===S.day?'now':'')+'"></i>'; return h+'</div>'; }
function taste(){ return clamp(1 - (Math.abs(S.lemonsPer-4)*0.14 + Math.abs(S.sugarPer-3)*0.14), 0.2, 1); }
function pitchersPossible(){ return Math.min(Math.floor(S.lemons/S.lemonsPer), Math.floor(S.sugar/S.sugarPer)); }
function cupsReady(){ return Math.min(pitchersPossible()*CUPS_PER_PITCHER, S.cups); }

/* ---------- screens ---------- */
function intro(){
  reset(); topbar();
  screen.innerHTML =
   '<div class="intro"><img src="../../img/penny-v2.png" alt="Penny"><div><h1>Pennys saftstånd</h1><p class="muted">Från <i>Penny och Guldboken</i></p></div></div>'+
   '<p>Penny behöver pengar till seglarlägret. Du har <b>7 dagar</b> och <b>50 kronor</b> att börja med. Kan du få ihop <b>'+money(GOAL)+'</b>?</p>'+
   '<p>Köp citroner, socker och muggar. Blanda ett recept som folk älskar. Sätt ett rättvist pris. Håll koll på vädret. Och håll ögonen öppna, för människorna omkring dig har också problem.</p>'+
   '<div class="note">”Problem är guld.” Det första sigillet i Guldboken</div>'+
   '<button class="btn" id="go">Öppna ståndet</button>';
  $("go").onclick = morning;
}

function morning(){
  S.forecast = pickWeather(); topbar();
  var ev = pickEvent();
  if (ev) { showEvent(ev); } else { shop(); }
}

/* events: small moral choices, each used at most once */
var EVENTS = [
  {id:"green", who:'<i class="fa-solid fa-person-cane" style="color:#8A5A2B" aria-hidden="true"></i> <i class="fa-solid fa-apple-whole" style="color:#B5392E" aria-hidden="true"></i>', title:"Herr Gröns äpplen",
   text:"Herr Grön har ont i ryggen, och äpplena ramlar ner över hela gräsmattan. Om du hjälper honom att plocka upp dem öppnar du ståndet sent i dag.",
   choices:[
     {t:"Hjälp Herr Grön först", f:function(){ S.lateStart=true; S.rep=clamp(S.rep+0.15,0.5,1.8); S.nextDayBonus+=6; S.helped++; S.earned+=3; S.money+=3; return "Herr Grön stack trettio kronor i din hand och sa: ”Du är en bra flicka, Penny Lind.” Han kommer att berätta för sina vänner om din saft."; }},
     {t:"Förlåt, jag måste sälja i dag", f:function(){ return "Du öppnar i tid. Herr Grön vinkar, men han ser trött ut."; }}
   ]},
  {id:"marcus", who:'<i class="fa-solid fa-campground" style="color:#2F5D7C" aria-hidden="true"></i> <i class="fa-solid fa-tags" style="color:#D9662B" aria-hidden="true"></i>', title:"Marcus öppnar mitt emot",
   text:"Marcus ställer upp ett stånd mitt emot, med partytält och en skylt: HALVA PRISET!",
   choices:[
     {t:"Halvera mitt pris också", f:function(){ S.price=Math.max(0.25, Math.round(S.price/2*4)/4); S.marcus="match"; return "Ditt pris är nu "+money(S.price)+". Ett priskrig har börjat."; }},
     {t:"Gör den godaste saften på gatan", f:function(){ S.marcus="quality"; return "Du behåller ditt pris och satsar på smaken. Om din saft är riktigt god kommer folk att märka det."; }}
   ]},
  {id:"sign", who:'<i class="fa-solid fa-child-dress" style="color:#D9662B" aria-hidden="true"></i> <i class="fa-solid fa-pencil" style="color:#E9B44C" aria-hidden="true"></i>', title:"Emma har en idé",
   text:"Emma säger: ”Ingen kan se vårt stånd från stora vägen. En stor skylt skulle kosta 15 kronor för kartongen.”",
   choices:[
     {t:"Köp kartongen (15 kr)", f:function(){ if(S.money<1.5) return "Du har inte tillräckligt med pengar än. Kanske senare."; S.money-=1.5; S.spent+=1.5; S.sign=true; return "Emma ritar en jättestor citron som ler. Fler hittar till er från och med nu."; }},
     {t:"Inte nu", f:function(){ return "Emma rycker på axlarna. ”Okej. Men tänk på saken.”"; }}
   ]},
  {id:"crew", who:'<i class="fa-solid fa-helmet-safety" style="color:#E9B44C" aria-hidden="true"></i> <i class="fa-solid fa-hammer" style="color:#8A5A2B" aria-hidden="true"></i>', title:"Ett törstigt arbetslag",
   text:"Pappas kompis har ett arbetslag som bygger ett hus längre ner på gatan. ”Kan du komma med 20 muggar vid lunch? Jag betalar 100 kronor.”",
   choices:[
     {t:"Ja! Jag levererar", f:function(){ S.crewOrder=true; return "Avgjort. Se till att du har minst 20 muggar redo i dag, annars sviker du honom."; }},
     {t:"Nej, det blir för mycket", f:function(){ return "Han nickar. ”Kanske en annan gång.”"; }}
   ]},
  {id:"tommy", who:'<i class="fa-solid fa-child" style="color:#2F5D7C" aria-hidden="true"></i> <i class="fa-solid fa-circle-question" style="color:#D9662B" aria-hidden="true"></i>', title:"Tommy vill hjälpa till",
   text:"Din lillebror Tommy vill jobba i ståndet. Han frågar ”varför?” om allt, och han kanske dricker upp lite av saften.",
   choices:[
     {t:"Visst, följ med", f:function(){ S.tommy=true; return "Tommy ropar ”SAFT!” till alla som går förbi. Det är pinsamt. Men det fungerar."; }},
     {t:"Inte i dag, Tommy", f:function(){ return "Tommy går tillbaka till sitt lego. Det blir tystare i ståndet."; }}
   ]},
  {id:"lee", who:'<i class="fa-solid fa-dog" style="color:#E9B44C" aria-hidden="true"></i> <i class="fa-solid fa-wind" style="color:#2F5D7C" aria-hidden="true"></i>', title:"Kanel rymmer",
   text:"Fru Lees golden retriever Kanel har rymt igen, och fru Lee sitter fast på jobbet på apoteket.",
   choices:[
     {t:"Stäng ståndet och leta efter Kanel", f:function(){ S.closedHalf=true; S.rep=clamp(S.rep+0.2,0.5,1.8); S.helped++; S.nextDayBonus+=8; return "Du hittar Kanel bakom kyrkan, alldeles lerig. Fru Lee kramar dig så hårt att du lyfter från marken. Alla på apoteket får höra historien."; }},
     {t:"Fortsätt sälja", f:function(){ return "Du fortsätter sälja, men du tittar hela tiden längs gatan efter en lerig gul hund."; }}
   ]}
];
function pickEvent(){
  if (S.day === 1 || Math.random() < 0.35) return null;
  var left = EVENTS.filter(function(e){ return !S.eventUsed[e.id]; });
  if (!left.length) return null;
  var e = left[Math.floor(Math.random()*left.length)]; S.eventUsed[e.id]=true; return e;
}
function showEvent(e){
  screen.innerHTML = daysBar() + '<div class="event"><div class="who">'+e.who+'</div><h2>'+e.title+'</h2><p>'+e.text+'</p><div class="choices" id="ch"></div></div>';
  e.choices.forEach(function(c){
    var b=document.createElement("button"); b.className="btn "+(c===e.choices[0]?"":"ghost"); b.textContent=c.t;
    b.onclick=function(){ var msg=c.f(); topbar(); screen.innerHTML = daysBar()+'<div class="event"><div class="who">'+e.who+'</div><p>'+msg+'</p></div><button class="btn" id="next">Gå till ståndet</button>'; $("next").onclick=shop; };
    $("ch").appendChild(b);
  });
}

function shop(){
  topbar();
  var w=S.forecast;
  screen.innerHTML = daysBar() +
   '<div class="weather"><div class="ic">'+w.ic+'</div><div><b>Dag '+S.day+': '+w.name+'</b><br><small class="muted">'+hint(w)+'</small></div></div>'+
   '<div class="section-title">Varor</div>'+
   supplyRow("lemons",'<i class="fa-solid fa-lemon" style="color:#E9B44C" aria-hidden="true"></i>')+supplyRow("sugar",'<i class="fa-solid fa-cubes-stacked" style="color:#B9A88F" aria-hidden="true"></i>')+supplyRow("cups",'<i class="fa-solid fa-glass-water" style="color:#2F5D7C" aria-hidden="true"></i>')+
   '<div class="section-title">Recept per kanna (10 muggar)</div>'+
   stepRow("Citroner","lemonsPer",1,8,"")+stepRow("Skopor socker","sugarPer",1,8,"")+
   '<div class="taste"><i id="tasteBar"></i></div><small class="muted" id="tasteTxt"></small>'+
   '<div class="section-title">Pris per mugg</div>'+
   stepRow("Pris","price",0.25,2.00,"")+
   '<p class="muted" id="ready" style="margin-top:10px"></p>'+
   '<button class="btn" id="sell">Öppna för dagen</button>';
  ["lemons","sugar","cups"].forEach(function(k){ $("buy-"+k).onclick=function(){ buy(k); }; });
  bindStep("lemonsPer",1,1,8); bindStep("sugarPer",1,1,8); bindStep("price",0.25,0.25,2.00);
  $("sell").onclick=sell; refresh();
}
function hint(w){
  return {hot:"Folk kommer att vara jättetörstiga i dag.",sunny:"En bra dag att sälja.",cloudy:"Färre människor ute.",rain:"Nästan ingen är ute. Köp inte för mycket."}[w.id];
}
function supplyRow(k,ic){
  var p=PRICES[k];
  return '<div class="row"><div class="lbl"><b>'+ic+' <span id="have-'+k+'">'+S[k]+'</span> i lager</b><small>'+p.label+': '+money(p.cost)+'</small></div><button class="btn alt" style="width:auto;margin:0;padding:10px 16px" id="buy-'+k+'">Köp</button></div>';
}
function stepRow(label,key,min,max,pre){
  return '<div class="row"><div class="lbl"><b>'+label+'</b></div><div class="stepper"><button id="m-'+key+'" aria-label="less">−</button><output id="o-'+key+'"></output><button id="p-'+key+'" aria-label="more">+</button></div></div>';
}
function bindStep(key,step,min,max){
  $("m-"+key).onclick=function(){ S[key]=clamp(+(S[key]-step).toFixed(2),min,max); refresh(); };
  $("p-"+key).onclick=function(){ S[key]=clamp(+(S[key]+step).toFixed(2),min,max); refresh(); };
}
function buy(k){
  var p=PRICES[k]; if(S.money < p.cost){ flash("Du har inte råd med det."); return; }
  S.money-=p.cost; S.spent+=p.cost; S[k]+=p.qty; refresh();
}
function flash(t){ var r=$("ready"); r.textContent=t; r.style.color="var(--red)"; setTimeout(refresh,1400); }
function refresh(){
  topbar(); if (!$("o-price")) return;
  ["lemons","sugar","cups"].forEach(function(k){ var e=$("have-"+k); if(e) e.textContent=S[k]; });
  $("o-lemonsPer").textContent=S.lemonsPer; $("o-sugarPer").textContent=S.sugarPer; $("o-price").textContent=money(S.price);
  var t=taste(); $("tasteBar").style.width=(t*100)+"%";
  $("tasteTxt").textContent = t>0.9?"Jättegott!": t>0.7?"Ganska gott.": t>0.5?"Hmm. Något är fel.":"Usch. Ingen kommer tillbaka för det här.";
  var r=$("ready"); r.style.color=""; var c=cupsReady();
  r.innerHTML = c>0 ? "Du kan servera <b>"+c+" muggar</b> i dag." : "Du kan inte göra någon saft än. Köp citroner, socker och muggar.";
}

function sell(){
  var w=S.forecast, t=taste();
  var priceFactor = S.price<=w.ideal ? 1 + (w.ideal-S.price)/w.ideal*0.35 : Math.max(0, 1 - (S.price-w.ideal)/(w.ideal*1.6));
  var demand = w.base * priceFactor * S.rep * rnd(0.85,1.15);
  if (S.sign) demand *= 1.2;
  if (S.tommy) demand *= 1.1;
  if (S.lateStart) demand *= 0.7;
  if (S.closedHalf) demand *= 0.5;
  if (S.marcus==="match") demand *= 0.95;
  if (S.marcus==="quality") demand *= (t>0.85 ? 1.05 : 0.7);
  demand += S.nextDayBonus; S.nextDayBonus=0;
  demand = Math.max(0, Math.round(demand));

  var avail = cupsReady(), crewMsg="", used=0;
  if (S.crewOrder){
    if (avail>=20){ avail-=20; used+=20; S.money+=10; S.earned+=10; S.served+=20; S.rep=clamp(S.rep+0.05,0.5,1.8); crewMsg="Du levererade 20 muggar till arbetslaget och tjänade 100 kronor. De hurrade."; }
    else { S.rep=clamp(S.rep-0.1,0.5,1.8); crewMsg="Du hade inte 20 muggar till arbetslaget. Pappas kompis blev besviken. Ett löfte är ett löfte."; }
  }
  var tommyDrank = S.tommy ? Math.min(3, avail) : 0; avail -= tommyDrank; used += tommyDrank;
  var sold = Math.min(demand, avail);
  used += sold; if (used) useCups(used);
  var revenue = sold * S.price;
  S.money += revenue; S.earned += revenue; S.served += sold;
  var missed = demand - sold;

  // rykte: smak och pris spelar roll
  var fair = S.price <= w.ideal*1.25;
  S.rep = clamp(S.rep + (t-0.7)*0.35 + (fair?0.02:-0.06), 0.5, 1.8);

  // citroner blir dåliga
  var spoiled = Math.floor(S.lemons*0.25); S.lemons -= spoiled;

  S.log.push({day:S.day, weather:w.name, sold:sold, revenue:revenue});
  S.lateStart=false; S.closedHalf=false; S.crewOrder=false; S.marcus=null; S.tommy=false;
  animate(sold, function(){ dayResult(sold, revenue, missed, spoiled, crewMsg, t, tommyDrank); });
}
function useCups(n){
  // varje kanna = 10 koppar; dra ingredienser för det som serverats
  var pitchers = Math.ceil(n/CUPS_PER_PITCHER);
  S.cups -= n;
  S.lemons = Math.max(0, S.lemons - pitchers*S.lemonsPer);
  S.sugar = Math.max(0, S.sugar - pitchers*S.sugarPer);
}
function animate(sold, done){
  screen.innerHTML = daysBar()+'<h2>Dag '+S.day+' i ståndet</h2><div class="street" id="street"><div class="stand"><i class="fa-solid fa-store" style="color:#D9662B" aria-hidden="true"></i></div></div><p class="muted" id="count">Kunder: 0</p>';
  var st=$("street"), shown=Math.min(sold,14), i=0, count=0, faces=["fa-person","fa-person-dress","fa-child","fa-child-dress","fa-person-cane","fa-person-walking"], cols=["#2F5D7C","#D9662B","#4E8A4A","#B5392E","#8C6BA8","#8A5A2B"];
  if (!shown){ setTimeout(done, 900); return; }
  var iv=setInterval(function(){
    var d=document.createElement("div"); d.className="walker"; d.innerHTML='<i class="fa-solid '+faces[Math.floor(Math.random()*faces.length)]+'" style="color:'+cols[Math.floor(Math.random()*cols.length)]+'"></i>';
    d.style.animationDuration=rnd(1.6,2.4)+"s"; st.appendChild(d);
    count += Math.round(sold/shown); $("count").textContent="Kunder: "+Math.min(count,sold);
    if(++i>=shown){ clearInterval(iv); setTimeout(function(){ $("count").textContent="Kunder: "+sold; setTimeout(done,500); },1200); }
  }, 180);
}
var NOTES = {
  great:["När du möter ett riktigt behov betalar folk gärna.","Pengar är ett kvitto på att man har hjälpt någon."],
  sold_out:["Folk ville ha mer än du hade. Nästa gång kan du vara redo.","Ett problem du inte kan lösa än är en lärdom till i morgon."],
  taste:["Gör det lilla bra. Folk minns hur det smakade.","Den som är trogen i det lilla får ansvar för mycket."],
  price:["Ett rättvist pris hjälper er båda. För högt och ingen köper. För lågt och du orkar inte fortsätta.","Fråga dig själv: vad är det värt för dem?"],
  slow:["Vissa dagar går trögt. Fortsätt.","Ge inte upp. Frön växer när man inte ser dem."]
};
function starIcons(n){ var h=""; for(var k=0;k<5;k++) h+='<i class="'+(k<n?"fa-solid":"fa-regular")+' fa-star" style="color:#E9B44C"></i>'; return h; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function dayResult(sold, revenue, missed, spoiled, crewMsg, t, tommyDrank){
  topbar();
  var note = t<0.6 ? pick(NOTES.taste) : missed>5 ? pick(NOTES.sold_out) : sold<5 ? pick(NOTES.slow) : (S.price>S.forecast.ideal*1.3 ? pick(NOTES.price) : pick(NOTES.great));
  var stars = Math.round(clamp((S.rep-0.5)/1.3*5,0,5));
  var h = daysBar()+'<h2>Slut på dag '+S.day+'</h2>'+
   '<div class="result-grid"><div><small>Sålda muggar</small><b>'+sold+'</b></div><div><small>Intjänat i dag</small><b>'+money(revenue)+'</b></div>'+
   '<div><small>Pengar nu</small><b>'+money(S.money)+'</b></div><div><small>Rykte</small><b class="stars">'+starIcons(stars)+'</b></div></div>';
  if (crewMsg) h+='<p>'+crewMsg+'</p>';
  if (missed>0) h+='<p>'+missed+' törstiga gick därifrån utan saft.</p>';
  if (tommyDrank) h+='<p class="muted">Tommy drack '+tommyDrank+' muggar. ”Kvalitetskontroll”, sa han.</p>';
  if (spoiled>0) h+='<p class="muted">'+spoiled+' citroner blev mjuka under natten.</p>';
  h+='<div class="note">'+note+'</div>';
  S.day++;
  h+= S.day>DAYS ? '<button class="btn" id="next">Se hur det gick för Penny</button>' : '<button class="btn" id="next">Nästa morgon</button>';
  screen.innerHTML=h; $("next").onclick = S.day>DAYS ? finale : morning;
}
function finale(){
  S.day=DAYS; topbar();
  var win = S.money>=GOAL, stars=Math.round(clamp((S.rep-0.5)/1.3*5,0,5));
  var title = win ? "Du klarade pengarna till seglarlägret!" : "Penny nådde inte målet den här gången.";
  var h='<div class="intro"><img src="../../img/penny-v2.png" alt="Penny"><div><h1>'+title+'</h1></div></div>'+
   '<div class="result-grid"><div><small>Pengar</small><b>'+money(S.money)+'</b></div><div><small>Mål</small><b>'+money(GOAL)+'</b></div>'+
   '<div><small>Serverade muggar</small><b>'+S.served+'</b></div><div><small>Grannar du hjälpt</small><b>'+S.helped+'</b></div></div>'+
   '<p>Rykte: <span class="stars">'+starIcons(stars)+'</span></p>';
  if (S.helped>0) h+='<p>Du stannade och hjälpte folk fast det kostade dig försäljningstid. I Guldboken är det ingen förlust. Det är hela hemligheten.</p>';
  else h+='<p>Du satsade på att sälja. Nästa gång kan du hålla utkik efter människor med problem. I Guldboken är det där guldet är gömt.</p>';
  h+='<div class="note">”Problem är guld.” Ta reda på hur Penny på riktigt fick ihop pengarna i <b>Penny och Guldboken</b>.</div>'+
     '<button class="btn" id="again">Spela igen</button>'+
     '<a class="btn alt" style="text-align:center;text-decoration:none" href="../#bocker">Vuxna: se boken</a>';
  screen.innerHTML=h; $("again").onclick=intro;
}
intro();
})();
</script>
